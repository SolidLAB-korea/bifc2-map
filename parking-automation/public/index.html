<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIFC 주차 할인 등록</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header><span class="mark">P</span><div><strong>BIFC 주차 할인 등록</strong><small>관리자 자동 등록</small></div><button class="icon" id="settingsButton" aria-label="설정">⚙</button></header>
<section class="hero"><p class="eyebrow">BIFC II · 부산국제금융센터</p><h1>차량번호 끝 4자리로<br>할인을 등록하세요.</h1><p>등록 이력을 확인해 같은 번호는 다시 적용하지 않습니다.</p></section>
<section class="panel"><label for="last4">차량번호 끝 4자리</label><div class="entry"><input id="last4" inputmode="numeric" maxlength="4" placeholder="예: 6163" autocomplete="off"><button id="registerButton">관리자 할인 등록</button></div><p id="connection" class="hint">연결 상태를 확인하는 중…</p></section>
<section class="results"><div class="section-title"><h2>처리 결과</h2><button id="refreshButton" class="text-button">새로고침</button></div><div id="result" class="empty">차량번호를 입력하면 처리 결과가 여기에 표시됩니다.</div><div id="history" class="history"></div></section>
</main>
<dialog id="settings"><form method="dialog"><div class="dialog-title"><h2>연동 설정</h2><button class="icon" value="cancel">×</button></div><p>배포된 앱은 관리자 접속 키가 있어야 처리 이력과 할인 등록 기능을 사용할 수 있습니다. 키는 이 브라우저 탭을 닫으면 사라집니다.</p><label>관리자 접속 키<input id="accessKey" type="password" autocomplete="off"></label><label>주차관리 사이트 주소<input id="siteUrl" type="url" value="http://211.35.216.49:84"></label><label>관리자 ID<input id="adminId" autocomplete="username"></label><label>관리자 비밀번호<input id="adminPassword" type="password" autocomplete="current-password"></label><button id="saveSettings" class="primary" value="default">설정 저장</button></form></dialog><script src="/app.js"></script></body></html>
